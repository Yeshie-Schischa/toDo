<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div id="note-contanier"></div>
        <button id="add">&plus;</button>
        <form>
            <label for="title">Title</label>
            <input type="text" name="title">
            <label for="body">Body</label>
            <textarea id="nBody" name="body"></textarea>
            <button id="save" type="button">Save</button>
        </form>
        <div id="a${index}" class="note">
            <h2>${each.title}</h2>
            <p>${each.body}</p>
            <input type="checkbox" ${each.checked ? "checked" : ""}>
            <div class="menu">
              <span>☰</span>
               <ul class="menu-list">
                <li class="edit">Edit</li>
                <li class="delete">Delete</li>
                <li class="cancel">Cancel</li>
               </ul>
            </div>
           <span class="time">${each.time}</span>
          </div>
          
        <p id="succesMsg">Note&nbsp;saved&nbsp;successfully</p>
        <script src="index.js"></script>
    </body>
</html>
